{% for field in form %}<div class="field{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}{% if field.errors %} field-error{% endif %}">
{% if field.field.widget.input_type == 'checkbox' %}<label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
{% else %}{{ field.label_tag }}{{ field }}{% endif %}
{% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}
