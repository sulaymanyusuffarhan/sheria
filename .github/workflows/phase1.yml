name: LSMS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LSMS_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/compile_i18n.py --check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lsms
          POSTGRES_HOST_AUTH_METHOD: trust # Temporary isolated CI service, not deployment settings.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lsms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LSMS_ENV: test
      LSMS_DB_ENGINE: postgresql
      LSMS_DB_HOST: 127.0.0.1
      LSMS_DB_PORT: '5432'
      LSMS_DB_USER: postgres
      LSMS_DB_NAME: lsms
      LSMS_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py test
